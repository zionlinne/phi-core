name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: CLI smoke
        run: |
          phi --help
          phi validate examples/sample_task.json
          set +e
          phi evaluate examples/sample_task.json
          code=$?
          set -e
          test "$code" -eq 3
      - name: Pytest
        run: python -m pytest -v
