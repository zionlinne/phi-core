[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "phi-core"
version = "0.0.1.dev0"
description = "Engineering scaffold for an independent three-valued feasibility operator Phi(T, E). The operator itself is NOT implemented yet."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.scripts]
phi = "phi_core.cli:main"

[project.urls]
Repository = "https://github.com/zionlinne/phi-core"

[tool.hatch.build.targets.wheel]
packages = ["src/phi_core"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/task_contract.schema.json" = "phi_core/_schemas/task_contract.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
